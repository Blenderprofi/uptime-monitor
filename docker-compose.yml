services:
  web:
    image: image_test:v1
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      
  worker:
    image: image_test:v1
    env_file:
      - .env
    command: ["python", "manage.py", "worker"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 5s
        timeout: 5s
        retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: