stages:
  - app
  - db
  - build
  - deploy

app:
  stage: app
  image: python:3.13-slim
  script:
    - pip --version
    - python --version
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
    - python manage.py test
    - python -c "import fastapi; import uvicorn; import psycopg; import redis; import rq; import celery; import sqlalchemy; print('All dependencies are installed and importable')"

db:
  stage: db
  image: python:3.13-slim
  services:
    - name: postgres:16-alpine
      alias: db

  variables:
    POSTGRES_USER: "mansur_admin"
    POSTGRES_PASSWORD: "123"
    POSTGRES_DB: "uptime_monitor"
    POSTGRES_HOST: "db"
    POSTGRES_PORT: "5432"
  script:
    - pip --version
    - pip install -r requirements.txt
    - python -c "import psycopg; conn = psycopg.connect(host='$POSTGRES_HOST', port='$POSTGRES_PORT', dbname='$POSTGRES_DB', user='$POSTGRES_USER', password='$POSTGRES_PASSWORD'); print('PostgreSQL connection successful'); conn.close()"

build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  script:
    - docker --version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  
deploy:
  stage: deploy
  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    - apk add --no-cache openssl
    - docker info

  script:
    - |
      DB_PASSWORD=$(openssl rand -hex 24)
      APP_SECRET=$(openssl rand -hex 32)

      cat > .env <<EOF
      POSTGRES_USER=pulsewatch_ci
      POSTGRES_PASSWORD=$DB_PASSWORD
      POSTGRES_DB=pulsewatch_ci
      DATABASE_URL=postgresql+psycopg://pulsewatch_ci:$DB_PASSWORD@db:5432/pulsewatch_ci
      SESSION_SECRET=$APP_SECRET
      EOF

    # login to GitLab Registry
    - |
      echo "$CI_REGISTRY_PASSWORD" |
      docker login "$CI_REGISTRY" \
        -u "$CI_REGISTRY_USER" \
        --password-stdin

    - docker pull "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" image_test:v1
    - docker compose up -d --wait --wait-timeout 120
    - docker compose ps

    #application health test
    - |
      docker compose exec -T web python -c "
      import time
      import urllib.request

      for attempt in range(20):
          try:
              response = urllib.request.urlopen(
                  'http://127.0.0.1:8000/api/health',
                  timeout=3
              )
              assert response.status == 200
              print('Application is healthy')
              break
          except Exception:
              if attempt == 19:
                  raise
              time.sleep(2)
      "

    #postgresql connection test
    - |
      docker compose exec -T web python -c "
      from sqlalchemy import text
      from app.database import engine

      with engine.connect() as conn:
          result = conn.execute(text('SELECT 1')).scalar()
          assert result == 1
          print('PostgreSQL connection successful')
      "

  after_script:
    - docker compose logs --no-color || true
    - docker compose down -v --remove-orphans || true



    
