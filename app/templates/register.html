{% extends "base.html" %}
{% block title %}Регистрация — PulseWatch{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Создать аккаунт</h1>
    <p class="muted">Начни с одного сайта. Остальное можно добавить позже.</p>
    <form method="post" action="/register" class="stack-form">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Email<input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label>
        <label>Пароль<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
        <button class="button" type="submit">Зарегистрироваться</button>
    </form>
</section>
{% endblock %}
