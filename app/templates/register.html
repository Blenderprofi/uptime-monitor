{% extends "base.html" %}
{% block title %}Create account — PulseWatch{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Create account</h1>
    <form method="post" action="/register" class="stack-form">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Email<input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
        <button class="button" type="submit">Create account</button>
    </form>
</section>
{% endblock %}
