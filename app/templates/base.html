<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Uptime Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">PulseWatch</a>
        <nav>
            {% if user %}
                <a href="/dashboard">Панель</a>
                <form method="post" action="/logout" class="inline-form">
                    <input type="hidden" name="csrf" value="{{ csrf_token }}">
                    <button class="link-button" type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="/login">Войти</a>
                <a class="button small" href="/register">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% if message %}<div class="notice">{{ message }}</div>{% endif %}
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
