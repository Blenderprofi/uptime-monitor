{% extends "base.html" %}
{% block title %}New monitor — PulseWatch{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Add website</h1>
    <form method="post" action="/monitors" class="stack-form">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Name<input name="name" value="{{ name or '' }}" maxlength="100" placeholder="My API" required></label>
        <label>URL<input type="url" name="url" value="{{ url or '' }}" placeholder="https://example.com" required></label>
        <label>Check interval
            <select name="interval_seconds">
                <option value="30">30 seconds</option>
                <option value="60" selected>1 minute</option>
                <option value="300">5 minutes</option>
                <option value="900">15 minutes</option>
            </select>
        </label>
        <button class="button" type="submit">Add website</button>
    </form>
</section>
{% endblock %}
