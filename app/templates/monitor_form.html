{% extends "base.html" %}
{% block title %}Новый монитор — PulseWatch{% endblock %}
{% block content %}
<section class="form-card">
    <p class="eyebrow">НОВЫЙ МОНИТОР</p><h1>Добавить сайт</h1>
    <form method="post" action="/monitors" class="stack-form">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <label>Название<input name="name" value="{{ name or '' }}" maxlength="100" placeholder="Мой API" required></label>
        <label>URL<input type="url" name="url" value="{{ url or '' }}" placeholder="https://example.com" required></label>
        <label>Интервал
            <select name="interval_seconds">
                <option value="30">30 секунд</option>
                <option value="60" selected>1 минута</option>
                <option value="300">5 минут</option>
                <option value="900">15 минут</option>
            </select>
        </label>
        <button class="button" type="submit">Сохранить</button>
    </form>
</section>
{% endblock %}
