# Scales the stateless web tier on CPU. Sessions are signed cookies, so any
# replica can serve any user. EKS Auto Mode adds nodes when pods don't fit.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsewatch-web
  labels:
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsewatch-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
