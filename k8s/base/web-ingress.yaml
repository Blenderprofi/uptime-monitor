# Becomes an AWS Application Load Balancer (one per environment).
# The ALB sends traffic straight to pod IPs, skipping an extra kube-proxy hop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsewatch-web
  labels:
    app.kubernetes.io/component: web
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsewatch-web
                port:
                  name: http
