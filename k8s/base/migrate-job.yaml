# Creates/updates the database schema once per deployment, BEFORE the new
# web/worker pods roll out (ci/deploy.sh waits for it to complete).
# This is the hook where Alembic migrations would run later.
apiVersion: batch/v1
kind: Job
metadata:
  name: pulsewatch-migrate
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsewatch
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: pulsewatch
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: pulsewatch
          command: ["python", "manage.py", "initdb"]
          envFrom:
            - secretRef:
                name: pulsewatch-app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
