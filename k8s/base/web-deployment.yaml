apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsewatch-web
  labels:
    app.kubernetes.io/component: web
spec:
  # No `replicas`: the HorizontalPodAutoscaler owns the replica count, and
  # re-applying a fixed number on every deploy would fight it.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime: a new pod must be Ready before an old one stops
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsewatch
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsewatch
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: pulsewatch
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64 # the CI image is built for amd64
      # Spread replicas over availability zones so one AZ outage can't take the site down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pulsewatch
              app.kubernetes.io/component: web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: pulsewatch
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: pulsewatch-app # DATABASE_URL + SESSION_SECRET, created by Terraform
          # Only send traffic once the DB is reachable...
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # ...but only restart the container if the process itself hangs.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the load balancer time to deregister the pod before it stops accepting connections.
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
