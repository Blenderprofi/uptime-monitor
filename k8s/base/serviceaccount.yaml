apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsewatch
  labels:
    app.kubernetes.io/component: shared
# The app never calls the Kubernetes API, so don't hand it a token.
automountServiceAccountToken: false
# Created by ci/deploy.sh from the GitLab deploy token (needed for private registries).
imagePullSecrets:
  - name: gitlab-registry
