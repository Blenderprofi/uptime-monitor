apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace, Secret and Pod Security labels are created by Terraform.
namespace: pulsewatch-production

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: pulsewatch-production
      environment: production
    includeSelectors: false
    includeTemplates: true

# Production keeps at least two web pods (spread across AZs) and can burst to six.
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: pulsewatch-web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Deployment
      name: pulsewatch-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 384Mi

# The pipeline runs `kustomize edit set image pulsewatch=<registry>/<image>:<commit-sha>` here.
