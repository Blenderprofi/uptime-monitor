# Cluster-wide: tells EKS Auto Mode's built-in load balancer controller to turn
# every Ingress with `ingressClassName: alb` into an internet-facing
# Application Load Balancer.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
